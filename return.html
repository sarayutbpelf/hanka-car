<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>เสร็จสิ้น | รพ.หันคา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;}
:root{--bg:#f0fff8;--card:#fff;--border:#c8eedd;--green:#0fab6e;--green-light:#e6f8f2;--green-dark:#08835a;--text:#1a3228;--muted:#5a8a72;--red:#e84545;--radius:14px;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.hdr{background:linear-gradient(135deg,var(--green-dark),var(--green));padding:22px 20px 36px;text-align:center;position:relative;flex-shrink:0;}
.hdr::after{content:'';position:absolute;bottom:-22px;left:-5%;right:-5%;height:44px;background:var(--bg);border-radius:50%;}
.hdr-icon{font-size:2.6rem;margin-bottom:6px;}
.hdr h1{color:#fff;font-size:1.25rem;font-weight:800;}
.hdr p{color:rgba(255,255,255,.7);font-size:.82rem;margin-top:5px;}
.content{flex:1;padding:32px 18px 40px;width:100%;}
.sec-title{font-size:.72rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:18px;}
.car-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
.car-item{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:16px 14px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent;}
.car-item.selected{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,171,110,.12);}
.car-radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.car-item.selected .car-radio{border-color:var(--green);background:var(--green);}
.car-item.selected .car-radio::after{content:'✓';color:#fff;font-size:.8rem;font-weight:800;}
.car-info{flex:1;}
.car-plate{font-size:1.05rem;font-weight:700;color:var(--text);}
.car-sub{font-size:.8rem;color:var(--muted);margin-top:3px;}
.car-dest{font-size:.88rem;font-weight:600;color:var(--green-dark);margin-top:3px;}
.preview{background:var(--green-light);border:1.5px solid rgba(15,171,110,.25);border-radius:var(--radius);padding:16px;margin-bottom:20px;display:none;}
.preview.show{display:block;}
.prow{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px;}
.prow:last-child{margin-bottom:0;}
.picon{width:20px;flex-shrink:0;}
.pval{font-size:.95rem;font-weight:700;color:var(--text);}
.btn{width:100%;border:none;border-radius:var(--radius);padding:17px;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;font-family:'Sarabun',sans-serif;font-size:1.1rem;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(15,171,110,.3);transition:transform .15s;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px;text-align:center;color:var(--muted);}
.spin{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:16px;}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:3rem;margin-bottom:12px;}
.empty-txt{font-size:1rem;font-weight:700;color:var(--text);}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a2332;color:#fff;padding:14px 26px;border-radius:50px;font-size:.95rem;font-weight:600;z-index:999;max-width:88vw;transition:transform .35s cubic-bezier(.34,1.4,.64,1);box-shadow:0 6px 24px rgba(0,0,0,.3);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--green);}
.toast.err{background:var(--red);}
.success-box{text-align:center;padding:48px 20px;}
.success-icon{font-size:4.5rem;margin-bottom:18px;}
.success-title{font-size:1.3rem;font-weight:800;color:var(--text);margin-bottom:10px;}
.success-msg{font-size:.95rem;color:var(--muted);line-height:1.8;}
.btn-back{margin-top:24px;width:100%;border:2px solid var(--border);background:none;border-radius:var(--radius);padding:14px;font-family:'Sarabun',sans-serif;font-size:1rem;font-weight:700;color:var(--muted);cursor:pointer;}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-icon">✅</div>
  <h1>เสร็จสิ้นภารกิจ</h1>
  <p>โรงพยาบาลหันคา</p>
</div>

<div id="mainContent" class="loading">
  <div class="spin"></div>
  <div>กำลังโหลดข้อมูล...</div>
</div>
<div class="toast" id="toast"></div>

<script>
const GAS = 'https://script.google.com/macros/s/AKfycbxTkj0fNXrmJi5osDZJmFwH1Ab4O57SIpu7zPNLhc6f81Z8uOTl2z3v0Jj11ZAwGKoobQ/exec';
let opts = null, sel = null;

window.onload = async () => {
  try {
    const r = await fetch(GAS + '?action=getFormOptions');
    opts = await r.json();
    renderList();
  } catch(e) { showErr('โหลดข้อมูลไม่สำเร็จ'); }
};

function renderList() {
  const busy = opts.busyCars || [];
  if (!busy.length) {
    document.getElementById('mainContent').innerHTML = `
      <div class="content">
        <div class="empty">
          <div class="empty-icon">🟢</div>
          <div class="empty-txt">ไม่มีรถที่ออกงานอยู่</div>
          <div class="car-sub" style="margin-top:8px">รถทุกคันว่างแล้ว</div>
        </div>
      </div>`;
    document.getElementById('mainContent').className = '';
    return;
  }
  const items = busy.map(c=>`
    <div class="car-item" id="ci_${e(c.plate)}" onclick="pick('${e(c.plate)}')">
      <div class="car-radio" id="cr_${e(c.plate)}"></div>
      <div class="car-info">
        <div class="car-plate">🚗 ${e(c.plate)}</div>
        ${c.carName?`<div class="car-sub">${e(c.carName)}</div>`:''}
        <div class="car-dest">📍 ${e(c.dest)}</div>
        <div class="car-sub">👤 ${e(c.driver)} &nbsp;🕐 ${e(c.timeOut)} น.</div>
      </div>
    </div>`).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="content">
      <div class="sec-title">✅ เลือกรถที่กลับถึง</div>
      <div class="car-list">${items}</div>
      <div class="preview" id="pv">
        <div class="prow"><span class="picon">🚗</span><span class="pval" id="pvP">—</span></div>
        <div class="prow"><span class="picon">👤</span><span class="pval" id="pvD">—</span></div>
        <div class="prow"><span class="picon">📍</span><span class="pval" id="pvDst">—</span></div>
        <div class="prow"><span class="picon">🕐</span><span class="pval" id="pvT">—</span></div>
      </div>
      <button class="btn" id="btnS" onclick="submit()" disabled>✅ ยืนยันกลับถึง</button>
    </div>`;
  document.getElementById('mainContent').className = '';
}

function pick(plate) {
  (opts.busyCars||[]).forEach(c => document.getElementById('ci_'+c.plate)?.classList.remove('selected'));
  sel = plate;
  document.getElementById('ci_'+plate)?.classList.add('selected');
  const c = (opts.busyCars||[]).find(x=>x.plate===plate);
  if (c) {
    document.getElementById('pvP').textContent   = c.plate + (c.carName?' ('+c.carName+')':'');
    document.getElementById('pvD').textContent   = c.driver;
    document.getElementById('pvDst').textContent = c.dest;
    document.getElementById('pvT').textContent   = 'ออก '+c.timeOut+' น.';
    document.getElementById('pv').classList.add('show');
    document.getElementById('btnS').disabled = false;
  }
}

async function submit() {
  if (!sel) return;
  setLoad(true);
  try {
    const data = await (await fetch(`${GAS}?action=submitReturn&plate=${encodeURIComponent(sel)}`)).json();
    setLoad(false);
    if (data.ok) {
      const c = (opts.busyCars||[]).find(x=>x.plate===sel);
      document.getElementById('mainContent').innerHTML = `
        <div class="content">
          <div class="success-box">
            <div class="success-icon">✅</div>
            <div class="success-title">กลับถึงแล้ว!</div>
            <div class="success-msg">🚗 ${e(sel)}<br>👤 ${e(c?c.driver:'')}<br>📍 จาก ${e(c?c.dest:'')}</div>
            <button class="btn-back" onclick="location.reload()">← บันทึกรายการใหม่</button>
          </div>
        </div>`;
    } else showToast(data.msg||'เกิดข้อผิดพลาด','err');
  } catch(err) { setLoad(false); showToast('เกิดข้อผิดพลาด','err'); }
}

function setLoad(on) {
  const b = document.getElementById('btnS');
  if (!b) return;
  b.disabled = on;
  b.textContent = on ? '⏳ กำลังบันทึก...' : '✅ ยืนยันกลับถึง';
}

function showErr(m) { document.getElementById('mainContent').innerHTML = `<div class="loading">❌ ${m}</div>`; }

let tt;
function showToast(m,t='') {
  const el=document.getElementById('toast');
  el.textContent=m; el.className='toast show'+(t?' '+t:'');
  clearTimeout(tt); tt=setTimeout(()=>el.className='toast',3500);
}
function e(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
