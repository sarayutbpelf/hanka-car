<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d2e6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hancar">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hancar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Prompt:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --navy:#0d2e6e; --blue:#1a5ce8; --blue-mid:#2d7ef7;
  --blue-light:#e0edff; --blue-soft:#f0f5ff;
  --red:#e02040; --red-light:#ffe0e5; --red-soft:#fff4f6;
  --green:#00914a; --green-mid:#00b857;
  --green-light:#d4f4e2; --green-soft:#f0fbf5;
  --orange:#d96000; --bg:#f0f5fb; --surface:#fff;
  --border:#dde8f5; --text:#0d1e3c; --text2:#2a4070;
  --muted:#6a85a8; --muted2:#9ab0cc;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* INSTALL BANNER */
#installBanner{
  display:none;position:fixed;
  bottom:calc(90px + env(safe-area-inset-bottom));
  left:12px;right:12px;z-index:500;
  background:var(--navy);color:#fff;
  border-radius:16px;padding:12px 14px;
  flex-direction:row;align-items:center;gap:10px;
  box-shadow:0 8px 32px rgba(13,46,110,.4);
}
#installBanner.show{display:flex;animation:slideUp .4s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.install-icon{font-size:2rem;flex-shrink:0;}
.install-text h4{font-size:.86rem;font-weight:700;}
.install-text p{font-size:.7rem;color:rgba(255,255,255,.7);margin-top:2px;}
.install-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0;}
.btn-install{background:var(--blue-mid);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-family:'Sarabun',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;}
.btn-dismiss{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;}

/* HEADER */
.app-header{background:linear-gradient(135deg,var(--navy) 0%,#1a45a0 100%);padding:16px 16px 24px;flex-shrink:0;position:relative;overflow:hidden;}
.app-header::after{content:'';position:absolute;bottom:-28px;left:-5%;right:-5%;height:56px;background:var(--bg);border-radius:50%;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-icon{width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.brand-text h1{font-family:'Prompt',sans-serif;font-size:.9rem;font-weight:700;color:#fff;line-height:1.2;}
.brand-text p{font-size:.62rem;color:rgba(255,255,255,.55);}
.header-actions{display:flex;align-items:center;gap:8px;}
.live-pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border-radius:20px;padding:5px 10px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.3);animation:blink 1.5s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.live-txt{font-size:.62rem;font-weight:800;color:#fff;letter-spacing:.5px;}
.notify-btn{width:36px;height:36px;background:rgba(255,255,255,.12);border:none;border-radius:10px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;position:relative;transition:background .2s;}
.notify-btn:active{background:rgba(255,255,255,.25);}
.notify-badge{position:absolute;top:-3px;right:-3px;width:12px;height:12px;background:var(--red);border-radius:50%;border:2px solid var(--navy);display:none;}
.notify-badge.show{display:block;}
.notify-btn.enabled{background:rgba(74,222,128,.2);}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:relative;z-index:1;}
.stat-pill{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 6px;text-align:center;}
.stat-num{font-family:'Prompt',sans-serif;font-size:1.7rem;font-weight:800;line-height:1;color:#fff;}
.stat-num.busy{color:#fca5a5;} .stat-num.free{color:#86efac;}
.stat-lbl{font-size:.6rem;font-weight:600;color:rgba(255,255,255,.6);margin-top:2px;}

/* TABS */
.tabs{display:flex;background:var(--surface);border-bottom:1.5px solid var(--border);flex-shrink:0;position:relative;z-index:10;margin-top:-1px;}
.tab-btn{flex:1;background:none;border:none;padding:12px 4px;font-family:'Sarabun',sans-serif;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;transition:color .2s,border-color .2s;display:flex;align-items:center;justify-content:center;gap:4px;}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-btn.active.tab-red{color:var(--red);border-bottom-color:var(--red);}
.tab-btn.active.tab-green{color:var(--green);border-bottom-color:var(--green);}
.tab-count{font-size:.6rem;font-weight:800;border-radius:8px;padding:1px 6px;}
.tab-btn.active .tab-count{background:var(--blue-light);color:var(--blue);}
.tab-btn.active.tab-red .tab-count{background:var(--red-light);color:var(--red);}
.tab-btn.active.tab-green .tab-count{background:var(--green-light);color:var(--green);}
.tab-btn:not(.active) .tab-count{background:var(--bg);color:var(--muted);}

/* SCREENS */
.screens{flex:1;overflow:hidden;position:relative;}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px;opacity:0;pointer-events:none;transition:opacity .2s;}
.screen.active{opacity:1;pointer-events:auto;}

/* CAR CARDS */
.car-card{background:var(--surface);border-radius:14px;margin-bottom:10px;overflow:hidden;border:1.5px solid var(--border);box-shadow:0 2px 10px rgba(13,46,110,.06);animation:fadeUp .3s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.car-card.busy{border-top:3px solid var(--red);}
.car-card.free{border-top:3px solid var(--green-mid);}
.car-head{display:flex;justify-content:space-between;align-items:flex-start;padding:13px 14px 7px;}
.car-plate{font-family:'Prompt',sans-serif;font-size:1.25rem;font-weight:800;color:var(--text);letter-spacing:.5px;}
.car-type{font-size:.65rem;color:var(--muted);margin-top:2px;}
.status-tag{font-size:.65rem;font-weight:800;padding:4px 10px;border-radius:16px;white-space:nowrap;}
.tag-busy{background:var(--red-light);color:var(--red);}
.tag-free{background:var(--green-light);color:var(--green);}
.car-body{padding:0 14px 13px;}
.divider{height:1px;background:var(--border);margin-bottom:10px;}
.info-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;font-size:.86rem;}
.info-row:last-child{margin-bottom:0;}
.iico{width:18px;flex-shrink:0;font-size:.9rem;}
.ival{font-weight:600;color:var(--text2);}
.ival.dest{color:var(--orange);}
.ival.ready{color:var(--green);}
.time-chips{display:flex;gap:7px;margin-top:8px;}
.tchip{flex:1;border-radius:9px;padding:7px;text-align:center;border:1.5px solid var(--border);}
.tchip.out{background:var(--red-soft);border-color:rgba(224,32,64,.15);}
.tchip.wait{background:var(--bg);border-color:var(--border);}
.tchip-lbl{font-size:.56rem;font-weight:600;color:var(--muted);margin-bottom:2px;}
.tchip-val{font-family:'Prompt',sans-serif;font-size:1rem;font-weight:700;color:var(--red);}
.tchip-wait-val{font-size:.78rem;color:var(--muted2);}

/* FORM */
.form-card{background:var(--surface);border-radius:14px;border:1.5px solid var(--border);padding:18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(13,46,110,.06);}
.form-title{font-size:.7rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.68rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.sel-wrap{position:relative;}
.sel-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:.8rem;}
select,input[type=text]{width:100%;appearance:none;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:13px 36px 13px 14px;font-family:'Sarabun',sans-serif;font-size:1rem;color:var(--text);outline:none;transition:border-color .2s;}
select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,92,232,.1);}
input[type=text]{padding-right:14px;}
.custom-input{margin-top:8px;display:none;}
.custom-input.show{display:block;}
.preview-box{background:var(--blue-soft);border:1.5px solid rgba(45,126,247,.2);border-radius:10px;padding:13px;margin-bottom:14px;display:none;}
.preview-box.show{display:block;}
.prev-row{display:flex;gap:8px;margin-bottom:6px;font-size:.88rem;}
.prev-row:last-child{margin-bottom:0;}
.prev-val{font-weight:700;color:var(--text2);}
.return-item{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .2s,box-shadow .2s;}
.return-item.selected{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,145,74,.1);}
.radio-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.return-item.selected .radio-circle{border-color:var(--green);background:var(--green);}
.radio-check{color:#fff;font-size:.72rem;font-weight:800;display:none;}
.return-item.selected .radio-check{display:block;}
.return-info{flex:1;}
.return-plate{font-size:1rem;font-weight:800;color:var(--text);}
.return-sub{font-size:.78rem;color:var(--muted);margin-top:3px;}
.return-dest{font-size:.82rem;font-weight:600;color:var(--orange);margin-top:2px;}
.btn-submit{width:100%;border:none;border-radius:12px;padding:16px;font-family:'Sarabun',sans-serif;font-size:1.05rem;font-weight:800;cursor:pointer;transition:transform .15s,opacity .2s;box-shadow:0 6px 20px rgba(0,0,0,.15);}
.btn-submit:active{transform:scale(.97);}
.btn-submit:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--blue-mid));color:#fff;}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green-mid));color:#fff;}

/* EMPTY / LOADER */
.empty-state{text-align:center;padding:48px 16px;color:var(--muted);}
.empty-icon{font-size:2.8rem;margin-bottom:12px;}
.empty-txt{font-size:.9rem;font-weight:700;color:var(--text2);}
.empty-sub{font-size:.76rem;margin-top:4px;}
.loader-state{text-align:center;padding:48px 16px;color:var(--muted);}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px;}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:10px;border:1.5px solid var(--border);}
.skel-line{background:var(--bg);border-radius:6px;margin-bottom:8px;animation:pulse 1.6s ease infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.success-state{text-align:center;padding:40px 20px;}
.success-icon{font-size:4rem;margin-bottom:14px;}
.success-title{font-family:'Prompt',sans-serif;font-size:1.1rem;font-weight:800;color:var(--text);margin-bottom:6px;}
.success-detail{font-size:.86rem;color:var(--muted);line-height:1.7;}
.btn-back{margin-top:18px;display:inline-block;background:var(--blue-soft);color:var(--blue);border:none;border-radius:10px;padding:10px 22px;font-family:'Sarabun',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;}

/* TOAST */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--text);color:#fff;padding:10px 20px;border-radius:22px;font-size:.82rem;font-weight:600;z-index:999;opacity:0;transition:all .3s;box-shadow:0 4px 16px rgba(0,0,0,.2);white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--green);}
.toast.err{background:var(--red);}

/* FAB */
.fab{position:fixed;bottom:100px;right:14px;z-index:100;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--blue-mid),var(--blue));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;box-shadow:0 4px 16px rgba(26,92,232,.38);transition:transform .15s;}
.fab:active{transform:scale(.9);}
.fab.spin-anim{animation:sp .7s linear infinite;}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}

/* UPDATE BAR */
.update-bar{text-align:center;padding:5px 0;font-size:.6rem;color:var(--muted2);flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);}

/* BOTTOM NAV — ออกแบบสำหรับผู้สูงอายุ */
.bottom-nav{
  display:flex;background:var(--surface);
  border-top:2px solid var(--border);
  flex-shrink:0;gap:10px;padding:10px 12px 14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;
  border:none;cursor:pointer;
  font-family:'Sarabun',sans-serif;
  font-size:.82rem;font-weight:800;
  padding:12px 6px;border-radius:14px;
  transition:all .15s;
}
.nav-icon{font-size:1.8rem;line-height:1;}
.nav-item.nav-status{background:var(--blue-soft);color:var(--blue);}
.nav-item.nav-status.active{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(26,92,232,.35);}
.nav-item.nav-depart{background:#fff3f3;color:var(--red);}
.nav-item.nav-depart.active{background:var(--red);color:#fff;box-shadow:0 4px 14px rgba(224,32,64,.35);}
.nav-item.nav-return{background:#f0fbf5;color:var(--green);}
.nav-item.nav-return.active{background:var(--green);color:#fff;box-shadow:0 4px 14px rgba(0,145,74,.35);}
.nav-item:active{transform:scale(.95);}
.tabs.hidden{display:none;}
</style>
</head>
<body>

<!-- Notification History Drawer -->
<div id="notifyDrawer" style="
  position:fixed;inset:0;z-index:400;display:none;
">
  <div id="notifyOverlay" onclick="closeNotifyDrawer()" style="
    position:absolute;inset:0;background:rgba(13,30,60,.45);
    backdrop-filter:blur(3px);
  "></div>
  <div style="
    position:absolute;top:0;right:0;bottom:0;width:92%;max-width:400px;
    background:var(--surface);display:flex;flex-direction:column;
    box-shadow:-8px 0 32px rgba(13,30,60,.2);
    animation:slideInRight .3s ease;
  ">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border-bottom:1.5px solid var(--border);flex-shrink:0;">
      <div>
        <div style="font-family:'Prompt',sans-serif;font-size:1rem;font-weight:700;color:var(--text)">🔔 ประวัติการแจ้งเตือน</div>
        <div style="font-size:.7rem;color:var(--muted);margin-top:2px" id="notifyCount">—</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button onclick="clearNotifyHistory()" style="
          background:var(--red-soft);color:var(--red);border:none;
          border-radius:8px;padding:6px 12px;font-family:'Sarabun',sans-serif;
          font-size:.78rem;font-weight:700;cursor:pointer;
        ">🗑️ ลบทั้งหมด</button>
        <button onclick="closeNotifyDrawer()" style="
          background:var(--bg);border:none;border-radius:8px;
          width:34px;height:34px;font-size:1.2rem;cursor:pointer;
        ">✕</button>
      </div>
    </div>
    <div id="notifyList" style="flex:1;overflow-y:auto;padding:12px;"></div>
  </div>
</div>

<!-- Install Banner -->
<div id="installBanner">
  <div class="install-icon">📱</div>
  <div class="install-text">
    <h4>ติดตั้งแอปบนมือถือ</h4>
    <p>เข้าใช้งานเร็วขึ้น + รับการแจ้งเตือน</p>
  </div>
  <div class="install-actions">
    <button class="btn-install" id="btnInstall">ติดตั้ง</button>
    <button class="btn-dismiss" id="btnDismiss">✕</button>
  </div>
</div>
</div>

<!-- Header -->
<div class="app-header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-icon">🚑</div>
      <div class="brand-text">
        <h1>Hancar</h1>
        <p>ระบบติดตามรถพยาบาล</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="live-pill"><div class="live-dot"></div><span class="live-txt">LIVE</span></div>
      <button class="notify-btn" id="notifyBtn" onclick="openNotifyDrawer()" title="ประวัติการแจ้งเตือน">
        🔔<span class="notify-badge" id="notifyBadge"></span>
      </button>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-pill"><div class="stat-num" id="stTotal">—</div><div class="stat-lbl">ทั้งหมด</div></div>
    <div class="stat-pill"><div class="stat-num busy" id="stBusy">—</div><div class="stat-lbl">ออกงาน</div></div>
    <div class="stat-pill"><div class="stat-num free" id="stFree">—</div><div class="stat-lbl">ว่าง</div></div>
  </div>
</div>

<!-- Tabs — เฉพาะหน้า Dashboard -->
<div class="tabs" id="dashTabs">
  <button class="tab-btn active" id="tab-all" onclick="filterDash('all')">🚐 ทั้งหมด <span class="tab-count" id="tc-all">—</span></button>
  <button class="tab-btn" id="tab-busy" onclick="filterDash('busy')">🔴 ออกงาน <span class="tab-count" id="tc-busy">—</span></button>
  <button class="tab-btn" id="tab-free" onclick="filterDash('free')">🟢 ว่าง <span class="tab-count" id="tc-free">—</span></button>
</div>

<!-- Screens -->
<div class="screens">
  <div class="screen active" id="screen-dashboard">
    <div id="carList">
      <div class="skel"><div class="skel-line" style="height:20px;width:45%;margin-bottom:12px"></div><div class="skel-line" style="height:13px;width:70%"></div></div>
      <div class="skel"><div class="skel-line" style="height:20px;width:38%"></div></div>
    </div>
  </div>
  <div class="screen" id="screen-depart">
    <div id="departContent"><div class="loader-state"><div class="spin"></div>กำลังโหลด...</div></div>
  </div>
  <div class="screen" id="screen-return">
    <div id="returnContent"><div class="loader-state"><div class="spin"></div>กำลังโหลด...</div></div>
  </div>
</div>

<div class="update-bar" id="updateBar">กำลังโหลดข้อมูล...</div>
<button class="fab" id="fab" onclick="loadAll()">🔄</button>
<div class="toast" id="toast"></div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <button class="nav-item nav-status active" id="nav-dashboard" onclick="showTab('dashboard')">
    <span class="nav-icon">🏠</span>
    <span>หน้าหลัก</span>
  </button>
  <button class="nav-item nav-depart" id="nav-depart" onclick="showTab('depart')">
    <span class="nav-icon">🚗💨</span>
    <span>ออกงาน</span>
  </button>
  <button class="nav-item nav-return" id="nav-return" onclick="showTab('return')">
    <span class="nav-icon">🏁</span>
    <span>กลับถึง</span>
  </button>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

const VAPID_KEY = 'BLTccIgo544kLcSj1a4r-H6tN7DH3zy7BTYVq-iCmDJX2dqxzDZPgJit8T3yooqxgH5w74Y333H4V8AeoB1u4zU';

// ══════════════════════════════════════════════
// NOTIFICATION HISTORY
// ══════════════════════════════════════════════
function getNotifyHistory() {
  try { return JSON.parse(localStorage.getItem('notifyHistory') || '[]'); } catch(e) { return []; }
}
function saveNotifyHistory(list) {
  localStorage.setItem('notifyHistory', JSON.stringify(list.slice(0, 50)));
}
function addNotifyHistory(title, body) {
  const list = getNotifyHistory();
  list.unshift({ title, body, time: Date.now() });
  saveNotifyHistory(list);
  // เพิ่ม unread count
  const unread = parseInt(localStorage.getItem('notifyUnread') || '0') + 1;
  localStorage.setItem('notifyUnread', String(unread));
  updateNotifyBadge();
}
function updateNotifyBadge() {
  const unread = parseInt(localStorage.getItem('notifyUnread') || '0');
  const badge  = document.getElementById('notifyBadge');
  if (badge) badge.classList.toggle('show', unread > 0);
}
function openNotifyDrawer() {
  if (!('Notification' in window) || Notification.permission !== 'granted') {
    requestNotify(); return;
  }
  localStorage.setItem('notifyUnread', '0');
  updateNotifyBadge();
  renderNotifyList();
  document.getElementById('notifyDrawer').style.display = 'block';
}
function closeNotifyDrawer() {
  document.getElementById('notifyDrawer').style.display = 'none';
}
function clearNotifyHistory() {
  if (!confirm('ลบประวัติการแจ้งเตือนทั้งหมด?')) return;
  localStorage.removeItem('notifyHistory');
  localStorage.setItem('notifyUnread', '0');
  updateNotifyBadge();
  renderNotifyList();
}
function renderNotifyList() {
  const list = getNotifyHistory();
  const el   = document.getElementById('notifyList');
  const cnt  = document.getElementById('notifyCount');
  if (cnt) cnt.textContent = list.length ? list.length + ' รายการ' : 'ยังไม่มีประวัติ';
  if (!list.length) {
    el.innerHTML = '<div style="text-align:center;padding:48px 16px;color:var(--muted)"><div style="font-size:2.5rem;margin-bottom:12px">🔕</div><div style="font-weight:700;color:var(--text2)">ยังไม่มีการแจ้งเตือน</div><div style="font-size:.78rem;margin-top:6px">เปิดรับการแจ้งเตือนก่อนนะครับ</div></div>';
    return;
  }
  el.innerHTML = list.map(function(n) {
    var d    = new Date(n.time);
    var date = d.toLocaleDateString('th-TH', {day:'numeric', month:'short'});
    var time = d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
    var isBusy   = n.title && n.title.includes('ออกงาน');
    var isReturn = n.title && n.title.includes('กลับถึง');
    var color = isBusy ? 'var(--red)' : isReturn ? 'var(--green)' : 'var(--blue)';
    var bg    = isBusy ? 'var(--red-soft)' : isReturn ? 'var(--green-soft)' : 'var(--blue-soft)';
    return '<div style="background:' + bg + ';border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:3px solid ' + color + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">' +
        '<div style="font-size:.9rem;font-weight:800;color:var(--text)">' + x(n.title||'') + '</div>' +
        '<div style="font-size:.68rem;color:var(--muted);white-space:nowrap;flex-shrink:0">' + date + ' ' + time + '</div>' +
      '</div>' +
      '<div style="font-size:.85rem;color:var(--text2);margin-top:5px;white-space:pre-line;line-height:1.6">' + x(n.body||'') + '</div>' +
    '</div>';
  }).join('');
}

// ══════════════════════════════════════════════
// PUSH NOTIFICATION

async function requestNotify() {
  if (!('Notification' in window)) {
    showToast('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน', 'err'); return;
  }

  const perm = await Notification.requestPermission();
  if (perm !== 'granted') {
    showToast('ไม่ได้รับอนุญาตการแจ้งเตือน', 'err'); return;
  }

  try {
    const sw    = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: sw });
    if (token) {
      await fetch(GAS_URL + '?action=saveFcmToken&token=' + encodeURIComponent(token));
      localStorage.setItem('fcmToken', token);
      document.getElementById('notifyBtn').classList.add('enabled');
      showToast('✅ เปิดการแจ้งเตือนแล้ว', 'ok');
      // เปิด drawer หลังอนุญาต
      setTimeout(() => openNotifyDrawer(), 800);
    }
  } catch(e) {
    console.error('FCM error:', e);
    showToast('เกิดข้อผิดพลาด: ' + e.message, 'err');
  }
}

// รับ Notification เมื่อแอปเปิดอยู่ (Foreground)
messaging.onMessage(payload => {
  const n    = payload.notification || {};
  const title = n.title || '🚑 Hancar';
  const body  = n.body  || '';
  showToast(title + '\n' + body, 'ok');
  // บันทึกประวัติ
  addNotifyHistory(title, body);
  // แสดง native notification
  if (Notification.permission === 'granted') {
    new Notification(title, { body, icon:'/icon-192.png', badge:'/icon-192.png' });
  }
  loadAll();
});

function checkNotifyStatus() {
  if (!('Notification' in window)) return;
  const token = localStorage.getItem('fcmToken');
  if (Notification.permission === 'granted' && token) {
    document.getElementById('notifyBtn').classList.add('enabled');
  } else {
    document.getElementById('notifyBadge').classList.add('show');
  }
  updateNotifyBadge();
}
}

let optsLoaded = false; // โหลด opts แค่ครั้งแรก

async function loadAll(forceOpts) {
  if (isLoading) return;
  isLoading = true;
  document.getElementById('fab').classList.add('spin-anim');
  try {
    if (!optsLoaded || forceOpts) {
      // โหลดครั้งแรก — ดึงทุกอย่าง
      const [r1, r2, r3] = await Promise.all([
        fetch(GAS_URL + '?action=getCarData'),
        fetch(GAS_URL + '?action=getFormOptions'),
        fetch(GAS_URL + '?action=getHashtags'),
      ]);
      allCars = await r1.json();
      opts    = await r2.json();
      const hd = await r3.json();
      opts.hashtags          = hd.hashtags || [];
      opts.ambulanceKeywords = hd.keywords || [];
      optsLoaded = true;
    } else {
      // refresh ปกติ — ดึงแค่สถานะรถ (เร็วกว่า 3x)
      const r1 = await fetch(GAS_URL + '?action=getCarData');
      allCars  = await r1.json();
      // อัปเดต freeCars/busyCars ใน opts ด้วย
      const r2 = await fetch(GAS_URL + '?action=getFormOptions');
      opts = { ...opts, ...(await r2.json()), hashtags: opts.hashtags, ambulanceKeywords: opts.ambulanceKeywords };
    }
    updateStats();
    renderDashboard();
    renderDepartForm();
    renderReturnForm();
    document.getElementById('updateBar').textContent =
      'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    showToast('โหลดข้อมูลไม่สำเร็จ','err');
  }
  isLoading = false;
  document.getElementById('fab').classList.remove('spin-anim');
}

function updateStats() {
  const busy = allCars.filter(c => c.status==='ออกงาน');
  const free = allCars.filter(c => c.status!=='ออกงาน');
  document.getElementById('stTotal').textContent = allCars.length;
  document.getElementById('stBusy').textContent  = busy.length;
  document.getElementById('stFree').textContent  = free.length;
  document.getElementById('tc-all').textContent  = allCars.length;
  document.getElementById('tc-busy').textContent = busy.length;
}

function renderDashboard() {
  let cars = [...allCars];
  if (currentFilter === 'busy') cars = cars.filter(c => c.status === 'ออกงาน');
  else if (currentFilter === 'free') cars = cars.filter(c => c.status !== 'ออกงาน');
  else cars.sort((a,b) => (a.status==='ออกงาน')===(b.status==='ออกงาน')?0:a.status==='ออกงาน'?-1:1);
  document.getElementById('carList').innerHTML = cars.length
    ? cars.map((c,i) => buildCarCard(c,i)).join('')
    : '<div class="empty-state"><div class="empty-icon">🚑</div><div class="empty-txt">ไม่มีข้อมูลรถ</div></div>';
}

function buildCarCard(c,i) {
  const busy = c.status==='ออกงาน';
  return `<div class="car-card ${busy?'busy':'free'}" style="animation-delay:${i*.05}s">
    <div class="car-head">
      <div><div class="car-plate">${x(c.plate)}</div>${c.carName?`<div class="car-type">${x(c.carName)}</div>`:''}</div>
      <span class="status-tag ${busy?'tag-busy':'tag-free'}">${busy?'🔴 ออกงาน':'🟢 ว่าง'}</span>
    </div>
    <div class="car-body"><div class="divider"></div>
      ${busy?`
        <div class="info-row"><span class="iico">👤</span><span class="ival">${x(c.driver)||'—'}</span></div>
        <div class="info-row"><span class="iico">📍</span><span class="ival dest">${x(c.dest)||'—'}</span></div>
        <div class="time-chips">
          <div class="tchip out"><div class="tchip-lbl">🕐 เวลาออก</div><div class="tchip-val">${x(c.timeOut)||'—'}</div></div>
          <div class="tchip wait"><div class="tchip-lbl">✅ กลับถึง</div><div class="tchip-wait-val">รอกลับ...</div></div>
        </div>`:`
        <div class="info-row"><span class="iico">✅</span><span class="ival ready">พร้อมใช้งาน</span></div>
        ${c.timeBack?`<div class="info-row"><span class="iico">🕐</span><span class="ival">กลับล่าสุด ${x(c.timeBack)} น.</span></div>`:''}`}

    : '<option value="">ไม่มีรถว่าง</option>';

  document.getElementById('departContent').innerHTML = `
    <div class="form-card">
      <div class="form-title">📤 บันทึกออกงาน</div>
      <div class="field"><label>พนักงานขับรถ</label>
        <div class="sel-wrap"><select id="d_driver" onchange="updateDepartPreview()"><option value="">— เลือก พขร. —</option>${driverOpts}</select></div></div>
      <div class="field"><label>ทะเบียนรถ</label>
        <div class="sel-wrap"><select id="d_plate" onchange="onPlateChange()"><option value="">— เลือกทะเบียน —</option>${carOpts}</select></div></div>
      <div class="field"><label>ปลายทาง</label>
        <div class="sel-wrap"><select id="d_dest" onchange="onDestChange()"><option value="">— เลือกปลายทาง —</option>${destOpts}<option value="__other__">✏️ พิมพ์เอง...</option></select></div>
        <div class="custom-input" id="d_customWrap"><input type="text" id="d_destCustom" placeholder="พิมพ์ปลายทาง..." oninput="updateDepartPreview()"></div></div>

      <div id="hashtagWrap" style="display:none;margin-bottom:14px">
        <label style="display:block;font-size:.68rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">🏷️ แฮชแท็ก (ไม่บังคับ)</label>
        <div id="hashtagGrid" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px"></div>
        <input type="text" id="hashtagCustom" placeholder="พิมพ์แฮชแท็กเพิ่มเติม... (เช่น #ด่วน)"

        <div class="prev-row">📍 <span class="prev-val" id="pv_dest">—</span></div>
      </div>
      <button class="btn-submit btn-blue" id="d_btn" onclick="submitDepart()" disabled>🚐 บันทึกออกงาน</button>
    </div>`;
}

function isAmbulance(plate) {
  if (!opts || !plate) return false;
  const car = (opts.freeCars||[]).find(c => c.plate === plate);
  if (!car) return false;
  const name = (car.carName || car.label || '').toLowerCase();
  return (opts.ambulanceKeywords||[]).some(k => name.includes(k.toLowerCase()));
}

function renderHashtags() {
  const grid = document.getElementById('hashtagGrid');
  if (!grid || !opts.hashtags) return;
  grid.innerHTML = (opts.hashtags||[]).map(h =>
    `<button class="htag-btn" onclick="toggleTag(this,'${esc(h)}')" type="button"
      style="padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);
      background:var(--surface);font-family:'Sarabun',sans-serif;font-size:.88rem;
      cursor:pointer;transition:all .15s;color:var(--text2);">${esc(h)}</button>`
  ).join('');
}

function toggleTag(el) {
  const active = el.getAttribute('data-active') === '1';
  if (active) {
    el.removeAttribute('data-active');
    el.style.background   = 'var(--surface)';
    el.style.color        = 'var(--text2)';
    el.style.borderColor  = 'var(--border)';
  } else {
    el.setAttribute('data-active','1');
    el.style.background   = 'var(--blue)';
    el.style.color        = '#fff';
    el.style.borderColor  = 'var(--blue)';
  }
  updateDepartPreview();
}

function getSelectedTags() {
  const selected = Array.from(document.querySelectorAll('.htag-btn[data-active="1"]')).map(b => b.textContent);
  const custom   = (document.getElementById('hashtagCustom')?.value || '').trim();
  if (custom) selected.push(custom);
  return selected.join(' ');
}

function onPlateChange() {
  const plate = document.getElementById('d_plate')?.value;
  const wrap  = document.getElementById('hashtagWrap');
  if (wrap) {
    if (plate && isAmbulance(plate)) {
      wrap.style.display = 'block';
      renderHashtags();
    } else {
      wrap.style.display = 'none';
      document.querySelectorAll('.htag-btn').forEach(b => {
        b.removeAttribute('data-active');
        b.style.background  = 'var(--surface)';
        b.style.color       = 'var(--text2)';
        b.style.borderColor = 'var(--border)';
      });
    }
  }
  updateDepartPreview();
}

function onDestChange() {
  const v = document.getElementById('d_dest')?.value;
  document.getElementById('d_customWrap')?.classList.toggle('show', v==='__other__');
  updateDepartPreview();
}

function updateDepartPreview() {
  const driver = document.getElementById('d_driver')?.value;
  const plate  = document.getElementById('d_plate')?.value;
  const dv     = document.getElementById('d_dest')?.value;
  const dest   = dv==='__other__' ? document.getElementById('d_destCustom')?.value : dv;
  const tags   = getSelectedTags();
  const fullDest = tags ? (dest||'') + ' ' + tags : dest;
  document.getElementById('pv_driver').textContent = driver   || '—';
  document.getElementById('pv_plate').textContent  = plate    || '—';
  document.getElementById('pv_dest').textContent   = fullDest || '—';
  document.getElementById('d_preview')?.classList.toggle('show', !!(driver||plate||dest));
  if (document.getElementById('d_btn'))
    document.getElementById('d_btn').disabled = !(driver && plate && dest);
}

async function submitDepart() {
  const driver = document.getElementById('d_driver').value;
  const plate  = document.getElementById('d_plate').value;
  const dv     = document.getElementById('d_dest').value;
  const dest   = dv==='__other__' ? document.getElementById('d_destCustom').value.trim() : dv;
  const hash   = getSelectedTags();
  if (!driver||!plate||!dest) return;
  const btn = document.getElementById('d_btn');
  btn.disabled=true; btn.textContent='⏳ กำลังบันทึก...';
  try {
    const res  = await fetch(GAS_URL+'?action=submitDepartByName&driverName='+encodeURIComponent(driver)+'&plate='+encodeURIComponent(plate)+'&dest='+encodeURIComponent(dest)+'&hashtags='+encodeURIComponent(hash));
    const data = await res.json();
    if (data.ok) {
      document.getElementById('departContent').innerHTML = `
        <div class="success-state">
          <div class="success-icon">✅</div>
          <div class="success-title">บันทึกออกงานแล้ว!</div>
          <div class="success-detail">🚗 ${x(plate)}<br>👤 ${x(driver)}<br>📍 ${x(dest)}</div>
          <button class="btn-back" onclick="loadAll();showTab('dashboard')">← กลับหน้าสถานะ</button>
        </div>`;
      loadAll();
    } else {
      showToast(data.msg||'เกิดข้อผิดพลาด','err');
      btn.disabled=false; btn.textContent='🚐 บันทึกออกงาน';
    }
  } catch(e) { showToast('เกิดข้อผิดพลาด','err'); btn.disabled=false; btn.textContent='🚐 บันทึกออกงาน'; }
}

function renderReturnForm() {
  if (!opts) return;
  const busy = opts.busyCars||[];
  if (!busy.length) {
    document.getElementById('returnContent').innerHTML = `
      <div class="empty-state"><div class="empty-icon">🟢</div>
      <div class="empty-txt">ไม่มีรถออกงานอยู่</div>
      <div class="empty-sub">รถทุกคันว่างแล้ว</div></div>`;
    return;
  }
  const items = busy.map(c=>`
    <div class="return-item" id="ri_${esc(c.plate)}" onclick="selectReturn('${esc(c.plate)}')">
      <div class="radio-circle"><span class="radio-check">✓</span></div>
      <div class="return-info">
        <div class="return-plate">🚗 ${esc(c.plate)}</div>
        ${c.carName?`<div class="return-sub">${esc(c.carName)}</div>`:''}
        <div class="return-dest">📍 ${esc(c.dest)}</div>
        <div class="return-sub">👤 ${esc(c.driver)} 🕐 ${esc(c.timeOut)} น.</div>
      </div>
    </div>`).join('');
  document.getElementById('returnContent').innerHTML = `
    <div class="form-card">
      <div class="form-title">📥 เลือกรถที่กลับถึง</div>
      ${items}
      <button class="btn-submit btn-green" id="r_btn" onclick="submitReturn()" disabled style="margin-top:4px">✅ ยืนยันกลับถึง</button>
    </div>`;
  selectedReturnPlate = null;
}

function selectReturn(plate) {
  (opts.busyCars||[]).forEach(c => document.getElementById('ri_'+c.plate)?.classList.remove('selected'));
  selectedReturnPlate = plate;
  document.getElementById('ri_'+plate)?.classList.add('selected');
  document.getElementById('r_btn').disabled = false;
}

async function submitReturn() {
  if (!selectedReturnPlate) return;
  const btn = document.getElementById('r_btn');
  btn.disabled=true; btn.textContent='⏳ กำลังบันทึก...';
  try {
    const res  = await fetch(GAS_URL+'?action=submitReturn&plate='+encodeURIComponent(selectedReturnPlate));
    const data = await res.json();
    const car  = (opts.busyCars||[]).find(c=>c.plate===selectedReturnPlate);
    if (data.ok) {
      document.getElementById('returnContent').innerHTML = `
        <div class="success-state">
          <div class="success-icon">✅</div>
          <div class="success-title">กลับถึงแล้ว!</div>
          <div class="success-detail">🚗 ${x(selectedReturnPlate)}<br>👤 ${x(car?.driver||'')}<br>📍 จาก ${x(car?.dest||'')}</div>
          <button class="btn-back" onclick="loadAll();showTab('dashboard')">← กลับหน้าสถานะ</button>
        </div>`;
      loadAll();
    } else {
      showToast(data.msg||'เกิดข้อผิดพลาด','err');
      btn.disabled=false; btn.textContent='✅ ยืนยันกลับถึง';
    }
  } catch(e) { showToast('เกิดข้อผิดพลาด','err'); btn.disabled=false; btn.textContent='✅ ยืนยันกลับถึง'; }
}

// ══════════════════════════════════════════════
// TAB & NAV
// ══════════════════════════════════════════════
function showTab(name) {
  ['dashboard','depart','return'].forEach(t => {
    document.getElementById('screen-'+t)?.classList.toggle('active', t===name);
  });
  // อัปเดต bottom nav
  document.getElementById('nav-dashboard')?.classList.toggle('active', name==='dashboard');
  document.getElementById('nav-depart')?.classList.toggle('active', name==='depart');
  document.getElementById('nav-return')?.classList.toggle('active', name==='return');
  // แสดง/ซ่อน tab filter เฉพาะหน้า dashboard
  const dashTabs = document.getElementById('dashTabs');
  if (dashTabs) dashTabs.classList.toggle('hidden', name !== 'dashboard');
  // ซ่อน FAB เมื่ออยู่หน้าออกงาน/กลับถึง
  const fab = document.getElementById('fab');
  if (fab) fab.style.display = name === 'dashboard' ? 'flex' : 'none';
}

let currentFilter = 'all';
function filterDash(filter) {
  currentFilter = filter;
  ['all','busy','free'].forEach(t => {
    const btn = document.getElementById('tab-'+t);
    if (!btn) return;
    btn.classList.toggle('active', t===filter);
    if (t===filter) {
      btn.classList.remove('tab-red','tab-green');
      if (t==='busy') btn.classList.add('tab-red');
      if (t==='free') btn.classList.add('tab-green');
    }
  });
  renderDashboard();
}

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
let toastTimer;
function showToast(msg,type='') {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show'+(type?' '+type:'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className='toast',3000);
}
function x(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function esc(s){return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

setInterval(loadAll, 60000);
window.onload = () => { loadAll(); checkNotifyStatus(); };
</script>
